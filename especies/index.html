<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Biodiversidad</title>
    
    <!-- 
        WEB PERFORMANCE & UX ARCHITECTURE
        - 0 External Requests (System Fonts, Inline SVGs)
        - Ultra-lightweight (Instant load on Edge/3G)
        - Purely informative / Visual Bridge
    -->

    <!-- Google Analytics placeholder -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=TU_ID_AQUI"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'TU_ID_AQUI');
    </script>

    <style>
        :root {
            --bg-deep: #020804;
            --jungle-dark: #0A1F14;
            --emerald: #10B981;
            --gold: #D4AF37;
            --text-primary: #FFFFFF;
            --text-secondary: rgba(255, 255, 255, 0.6);
            --glass: rgba(255, 255, 255, 0.04);
        }

        * {
            box-sizing: border-box;
            margin: 0; padding: 0;
            /* Ultra-optimized font stack */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            line-height: 1.5;
            background: radial-gradient(circle at 50% -10%, var(--jungle-dark) 0%, var(--bg-deep) 100%);
        }

        /* Decorative Background Elements (CSS only) */
        .ambient-light {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
            background: 
                radial-gradient(circle at 10% 20%, rgba(16, 185, 129, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(212, 175, 55, 0.03) 0%, transparent 40%);
        }

        main {
            position: relative;
            z-index: 10;
            flex-grow: 1;
            width: 100%;
            max-width: 440px;
            margin: 0 auto;
            padding: 3rem 1.5rem;
            display: flex;
            flex-direction: column;
        }

        header {
            text-align: center;
            margin-bottom: 3.5rem;
        }

        .museum-badge {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 5px;
            color: var(--gold);
            font-weight: 800;
            margin-bottom: 1rem;
            display: block;
        }

        h1 {
            font-size: 2.6rem;
            font-weight: 900;
            line-height: 1.1;
            letter-spacing: -1.5px;
            background: linear-gradient(to bottom, #FFF, #CCC);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Information Steps */
        .info-grid {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            margin-bottom: 4rem;
        }

        .step-card {
            background: var(--glass);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 28px;
            padding: 1.5rem;
            display: flex;
            align-items: center;
            gap: 1.2rem;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .step-visual {
            width: 52px; height: 52px;
            background: rgba(16, 185, 129, 0.1);
            border: 2px solid var(--emerald);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            color: var(--emerald);
            font-weight: 900;
            font-size: 1.3rem;
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.2);
        }

        .step-text h2 {
            font-size: 1rem;
            font-weight: 800;
            margin-bottom: 4px;
            color: var(--text-primary);
        }

        .step-text p {
            font-size: 0.85rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        /* Action Button */
        .footer-action {
            margin-top: auto;
        }

        .btn-start {
            width: 100%;
            background: var(--text-primary);
            color: var(--bg-deep);
            border: none;
            padding: 1.4rem;
            border-radius: 24px;
            font-size: 1.2rem;
            font-weight: 900;
            letter-spacing: 2px;
            cursor: pointer;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: transform 0.2s;
        }

        .btn-start:active {
            transform: scale(0.96);
        }

        .btn-start svg {
            width: 24px; height: 24px;
            fill: none; stroke: currentColor; stroke-width: 3;
        }

        /* Decorative Leaf SVG (Inline) */
        .leaf-svg {
            position: absolute;
            top: -20px; right: -10px;
            width: 60px; height: 60px;
            opacity: 0.1;
            fill: var(--emerald);
        }
    </style>
</head>
<body>

    <div class="ambient-light"></div>

    <main>
        <header>
            <div style="margin-bottom: 1rem;">
                <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="var(--gold)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                </svg>
            </div>
            <span class="museum-badge">Museo de Ciencia de Chiapas</span>
            <h1>Especies en extinción</h1>
        </header>

        <div class="info-grid">
            <!-- Step 1 -->
            <div class="step-card">
                <div class="step-visual">1</div>
                <div class="step-text">
                    <h2>Escanea el código QR</h2>
                    <p>Enfoca el código ubicado en la especie.</p>
                </div>
            </div>

            <!-- Step 2 -->
            <div class="step-card">
                <div class="step-visual">2</div>
                <div class="step-text">
                    <h2>Acepta los permisos</h2>
                    <p>Permite el uso de la cámara cuando se te lo solicite.</p>
                </div>
            </div>

            <!-- Step 3 -->
            <div class="step-card">
                <div class="step-visual">3</div>
                <div class="step-text">
                    <h2>Visualiza la información</h2>
                    <p>Descubre la biodiversidad de Chiapas.</p>
                </div>
            </div>
        </div>

        <div class="footer-action">
            <button class="btn-start">
                ¡COMENZAR!
                <svg viewBox="0 0 24 24">
                    <path d="M5 12h14M12 5l7 7-7 7"></path>
                </svg>
            </button>
        </div>
    </main>

</body>
</html>
