<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="theme-color" content="#000"/>
<title>WildAR · Jaguar</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Raleway:ital,wght@0,300;0,400;0,600;1,300&family=Share+Tech+Mono&display=swap" rel="stylesheet">

<style>
/*
  ══════════════════════════════════════════════
  COLORES POR ESTADO — edita solo :root
  CRÍTICO    →  --A:#FF1744  --B:#FF6D00  --glow:255,23,68
  VULNERABLE →  --A:#FF9100  --B:#FFCA28  --glow:255,145,0
  AMENAZADO  →  --A:#00E5FF  --B:#00BFA5  --glow:0,229,255
  ══════════════════════════════════════════════
*/
:root {
  --A: #FF9100;
  --B: #FFCA28;
  --glow: 255,145,0;
  --ph: 100vh;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  background: #000;
  font-family: 'Raleway', sans-serif;
  color: #fff;
  -webkit-tap-highlight-color: transparent;
}

/* ══ CÁMARA DE FONDO ══ */
#cam-bg {
  position: fixed;
  top: 0; left: 0;
  width: 100%;
  height: 100%;
  min-width: 100vw;
  min-height: 100vh;
  object-fit: cover;
  object-position: center center;
  z-index: 0;
  display: block;
  background: #000;
  transform: translateZ(0); /* force GPU layer */
}

#cam-veil { display: none; }

/* ══ BOTÓN ACTIVAR CÁMARA ══ - eliminado */

/* ══ HUD eliminado ══ */

/* ══ overlays decorativos eliminados ══ */

/* ── NAVEGACIÓN EN PANEL ── */
.nav-row {
  display: flex;
  justify-content: space-between;
  margin-bottom: 12px;
}
.nav-btn {
  width: 36px; height: 36px;
  border-radius: 50%;
  background: rgba(255,255,255,.08);
  border: 1px solid rgba(255,255,255,.15);
  display: flex; align-items: center; justify-content: center;
  text-decoration: none; color: #fff;
  font-size: .85rem;
  font-family: 'Share Tech Mono', monospace;
  cursor: pointer;
  transition: background .2s;
}
.nav-btn:active { background: rgba(255,255,255,.2); }

/* ══ PANEL INFERIOR ══ */
#panel {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  z-index: 180;
  height: var(--ph);
  border-radius: 0;
  overflow: hidden;

  background: transparent;
  backdrop-filter: none;
  -webkit-backdrop-filter: none;

  border-top: none;
  box-shadow: none;

  animation: panel-in .65s cubic-bezier(.16,1,.3,1) both;
}

#panel::before { display: none; }
#panel::after  { display: none; }

.panel-scroll {
  position: relative; z-index: 1;
  height: 100%;
  overflow-y: auto; overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  padding: calc(env(safe-area-inset-top, 0px) + 16px) 18px calc(env(safe-area-inset-bottom, 0px) + 24px);
  scrollbar-width: none;
}
.panel-scroll::-webkit-scrollbar { display: none; }

.handle { display: none; }

/* ── CABECERA ESPECIE ── */
.sp-head {
  display: flex; align-items: center; gap: 14px;
  margin-bottom: 14px;
}
.sp-orb {
  width: 62px; height: 62px; flex-shrink: 0;
  border-radius: 16px;
  background: linear-gradient(145deg, var(--B), var(--A));
  display: flex; align-items: center; justify-content: center;
  font-size: 2rem;
  box-shadow:
    0 6px 24px rgba(var(--glow),.45),
    inset 0 1px 0 rgba(255,255,255,.3);
  position: relative;
}
.sp-orb::after {
  content: '';
  position: absolute; inset: -4px; border-radius: 19px;
  border: 1px dashed rgba(var(--glow),.35);
}
.sp-meta { flex: 1; min-width: 0; }
.sp-pill {
  display: inline-flex; align-items: center; gap: 5px;
  background: rgba(var(--glow),.14);
  border: 1px solid rgba(var(--glow),.4);
  color: var(--A);
  font-family: 'Share Tech Mono', monospace;
  font-size: .54rem; letter-spacing: .14em; text-transform: uppercase;
  padding: 3px 9px; border-radius: 999px;
  margin-bottom: 5px;
}
.sp-pill::before {
  content: '';
  width: 4px; height: 4px; border-radius: 50%;
  background: var(--A);
  animation: blink 1.4s ease-in-out infinite;
}
.sp-nombre {
  font-family: 'Cinzel', serif;
  font-size: 1.7rem; font-weight: 700;
  line-height: 1; letter-spacing: .01em;
  margin-bottom: 3px;
  text-shadow: 0 2px 16px rgba(var(--glow),.2);
}
.sp-cient {
  font-family: 'Raleway', sans-serif;
  font-style: italic; font-weight: 300;
  font-size: .8rem; color: rgba(255,255,255,.4);
}

/* ── FAJA CATEGORÍA ── */
.cat-row {
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 14px;
}
.cat-line {
  flex: 1; height: 1px;
  background: linear-gradient(to right, rgba(var(--glow),.4), transparent);
}
.cat-line.r { background: linear-gradient(to left, rgba(var(--glow),.4), transparent); }
.cat-txt {
  font-family: 'Share Tech Mono', monospace;
  font-size: .56rem; letter-spacing: .16em; text-transform: uppercase;
  color: rgba(255,255,255,.3);
  white-space: nowrap;
}

/* ── FICHAS KPI ── */
.kpis {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 7px;
  margin-bottom: 16px;
}
.kpi {
  background: rgba(0,0,0,.18);
  border: 1px solid rgba(255,255,255,.15);
  border-radius: 11px;
  padding: 10px 12px;
  position: relative; overflow: hidden;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}
.kpi::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 1px;
  background: linear-gradient(to right, transparent, rgba(var(--glow),.35), transparent);
}
.kpi-ico { font-size: .85rem; margin-bottom: 3px; }
.kpi-lbl {
  font-family: 'Share Tech Mono', monospace;
  font-size: .5rem; letter-spacing: .12em; text-transform: uppercase;
  color: rgba(255,255,255,.28); margin-bottom: 3px;
}
.kpi-val { font-size: .86rem; font-weight: 600; line-height: 1.2; }
.kpi-val.alert { color: var(--A); }

/* ══════════════════════════════
   BOTONES DE SECCIÓN (tabs)
══════════════════════════════ */
.tab-row {
  display: flex; gap: 6px;
  margin-bottom: 16px;
  overflow-x: auto;
  scrollbar-width: none;
}
.tab-row::-webkit-scrollbar { display: none; }

.tab-btn {
  flex: 1;
  min-width: 0;
  padding: 9px 6px;
  border-radius: 10px;
  border: 1px solid rgba(255,255,255,.12);
  background: rgba(0,0,0,.18);
  color: rgba(255,255,255,.55);
  font-family: 'Share Tech Mono', monospace;
  font-size: .52rem;
  letter-spacing: .08em;
  text-transform: uppercase;
  text-align: center;
  cursor: pointer;
  transition: background .2s, color .2s, border-color .2s, box-shadow .2s;
  -webkit-tap-highlight-color: transparent;
  white-space: nowrap;
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
}
.tab-btn.active {
  background: rgba(var(--glow),.16);
  border-color: rgba(var(--glow),.55);
  color: var(--A);
  box-shadow: 0 0 12px rgba(var(--glow),.20), inset 0 1px 0 rgba(255,255,255,.08);
}
.tab-btn:active { opacity: .7; }

/* ══════════════════════════════
   SECCIONES DE CONTENIDO
══════════════════════════════ */
.tab-section {
  display: none;
  animation: fade-in .3s ease both;
}
.tab-section.visible { display: block; }

@keyframes fade-in {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ── DESCRIPCIÓN ── */
.desc-txt {
  font-family: 'Raleway', sans-serif;
  font-size: .94rem; font-weight: 300;
  line-height: 1.9; color: rgba(255,255,255,.78);
  margin-bottom: 18px;
}
.desc-txt::first-letter {
  font-family: 'Cinzel', serif;
  font-size: 2.6rem; font-weight: 900;
  float: left; line-height: .82;
  margin: .06em .1em 0 0;
  color: var(--A);
  text-shadow: 0 0 20px rgba(var(--glow),.6);
}

/* ── AMENAZAS ── */
.threats { margin-bottom: 18px; }
.threat {
  display: flex; align-items: flex-start; gap: 12px;
  padding: 11px 0;
  border-bottom: 1px solid rgba(255,255,255,.055);
  font-size: .84rem; font-weight: 300;
  color: rgba(255,255,255,.72); line-height: 1.6;
}
.threat:last-child { border: none; padding-bottom: 0; }
.threat-n {
  font-family: 'Cinzel', serif;
  font-size: 1rem; font-weight: 700; color: var(--A);
  width: 22px; flex-shrink: 0; text-align: right; margin-top: 1px;
  text-shadow: 0 0 8px rgba(var(--glow),.5);
}

/* ── CURIOSIDADES ── */
.facts { display: flex; flex-direction: column; gap: 9px; margin-bottom: 20px; }
.fact {
  background: rgba(0,0,0,.18);
  border: 1px solid rgba(var(--glow),.22);
  border-radius: 12px;
  padding: 13px 14px;
  position: relative; overflow: hidden;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}
.fact::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 1px;
  background: linear-gradient(to right, transparent, rgba(var(--glow),.45), transparent);
}
.fact-tag {
  font-family: 'Share Tech Mono', monospace;
  font-size: .52rem; letter-spacing: .14em; text-transform: uppercase;
  color: var(--B); margin-bottom: 5px;
}
.fact-body {
  font-family: 'Raleway', sans-serif;
  font-size: .88rem; font-weight: 300;
  line-height: 1.7; color: rgba(255,255,255,.8);
}

/* ── OTRAS ESPECIES ── */
.others {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 7px;
  margin-top: 4px;
}
.other {
  display: flex; flex-direction: column; align-items: center; gap: 5px;
  background: rgba(0,0,0,.18);
  border: 1px solid rgba(255,255,255,.12);
  border-radius: 12px; padding: 12px 8px;
  color: #fff;
  transition: background .2s;
  cursor: pointer;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}
.other:active { background: rgba(255,255,255,.15); }
.other-ico { font-size: 1.55rem; }
.other-nom {
  font-family: 'Cinzel', serif;
  font-size: .62rem; text-align: center; line-height: 1.35;
}

/* ══ TRANSICIÓN ══ */
#veil {
  position: fixed; inset: 0; z-index: 9999;
  background: #000;
  opacity: 0;
  pointer-events: none;
  transition: opacity .35s ease;
}
#veil.show { opacity: 1; pointer-events: all; }

/* ══ KEYFRAMES ══ */
@keyframes blink   { 0%,100%{opacity:1} 50%{opacity:.2} }
@keyframes scan-anim {
  0%   { top: 72px; opacity: 0; }
  5%   { opacity: .6; }
  95%  { opacity: .3; }
  100% { top: calc(100vh - var(--ph) - 12px); opacity: 0; }
}
@keyframes panel-in {
  from { transform: translateY(50px); opacity: 0; }
  to   { transform: translateY(0);    opacity: 1; }
}
</style>
</head>

<!-- ════════════════════════════════════════════════
     JAVASCRIPT
════════════════════════════════════════════════ -->
<script>
/* ── Colores por estado ── */
const COLS = {
  "EN PELIGRO CRÍTICO": { A:"#FF1744", B:"#FF6D00", glow:"255,23,68"  },
  "VULNERABLE":         { A:"#FF9100", B:"#FFCA28", glow:"255,145,0"  },
  "AMENAZADO":          { A:"#00E5FF", B:"#00BFA5", glow:"0,229,255"  },
};

/* ── Render ── */
(function init(){
  const E  = D;
  const co = COLS[E.estado] || COLS["VULNERABLE"];
  const R  = document.documentElement;

  R.style.setProperty('--A', co.A);
  R.style.setProperty('--B', co.B);
  R.style.setProperty('--glow', co.glow);
  document.title = `Wild · ${E.nombre}`;

  // Panel
  document.getElementById('ui-orb').textContent    = E.emoji;
  document.getElementById('ui-pill').textContent   = E.estado;
  document.getElementById('ui-nombre').textContent = E.nombre;
  document.getElementById('ui-cient').textContent  = E.cient;
  document.getElementById('ui-cat').textContent    = E.categoria;
  document.getElementById('ui-hab').textContent    = E.habitat;
  document.getElementById('ui-pob').textContent    = E.poblacion;
  document.getElementById('ui-tam').textContent    = E.tamaño;
  document.getElementById('ui-pes').textContent    = E.peso;
  document.getElementById('ui-desc').textContent   = E.desc;

  // Nav
  document.getElementById('btn-back').href = E.anterior;

  // Amenazas
  document.getElementById('ui-threats').innerHTML = E.amenazas
    .map((a,i) => `
      <div class="threat">
        <span class="threat-n">${String(i+1).padStart(2,'0')}</span>
        <span>${a}</span>
      </div>`)
    .join('');

  // Curiosidades
  document.getElementById('ui-facts').innerHTML = E.curiosidades
    .map(c => `
      <div class="fact">
        <div class="fact-tag">${c.t}</div>
        <div class="fact-body">${c.txt}</div>
      </div>`)
    .join('');

  // Otras especies
  document.getElementById('ui-others').innerHTML = E.relacionadas
    .map(r => `
      <div class="other" onclick="navegar('${r.url}')">
        <span class="other-ico">${r.ico}</span>
        <span class="other-nom">${r.nom}</span>
      </div>`)
    .join('');
})();

/* ── TABS ── */
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    // quitar activo de botones y secciones
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-section').forEach(s => s.classList.remove('visible'));

    btn.classList.add('active');
    const id = 'tab-' + btn.dataset.tab;
    const sec = document.getElementById(id);
    if (sec) {
      // forzar re-animación
      sec.classList.remove('visible');
      void sec.offsetWidth;
      sec.classList.add('visible');
    }
    // scroll al inicio del panel
    document.querySelector('.panel-scroll').scrollTo({ top: 0, behavior: 'smooth' });
  });
});

/* ── CÁMARA DE FONDO ── */
(async function startCamera(){
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } },
      audio: false
    });
    const video = document.getElementById('cam-bg');
    video.srcObject = stream;
    video.play();
  } catch(e) {
    console.warn('Cámara no disponible:', e.message);
  }
})();

/* ── Transición entre páginas ── */
function navegar(url){
  const v = document.getElementById('veil');
  v.classList.add('show');
  setTimeout(() => window.location.href = url, 360);
}
window.addEventListener('DOMContentLoaded', () => {
  const v = document.getElementById('veil');
  v.style.opacity = '1';
  v.style.transition = 'none';
  requestAnimationFrame(() => requestAnimationFrame(() => {
    v.style.transition = 'opacity .4s ease';
    v.style.opacity = '0';
  }));
});

/* ── Sonido ambiente ── */
let audioCtx = null, soundNodes = [];
const PRESETS = {
  selva:  { type:'bandpass', freq:900,  Q:.5,  gain:.15, lfo:null },
  oceano: { type:'lowpass',  freq:380,  Q:1.4, gain:.18, lfo:.1  },
  lluvia: { type:'highpass', freq:2200, Q:.2,  gain:.12, lfo:null },
  viento: { type:'bandpass', freq:180,  Q:.3,  gain:.14, lfo:.25 },
  cueva:  { type:'lowpass',  freq:200,  Q:2,   gain:.10, lfo:null },
};
function startAmbient(tipo){
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();
    const p = PRESETS[tipo] || PRESETS.selva;
    const bufLen = audioCtx.sampleRate * 4;
    const buf  = audioCtx.createBuffer(1, bufLen, audioCtx.sampleRate);
    const data = buf.getChannelData(0);
    for(let i = 0; i < bufLen; i++) data[i] = Math.random() * 2 - 1;
    const src = audioCtx.createBufferSource();
    src.buffer = buf; src.loop = true;
    const filt = audioCtx.createBiquadFilter();
    filt.type = p.type; filt.frequency.value = p.freq; filt.Q.value = p.Q;
    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(0, audioCtx.currentTime);
    gain.gain.linearRampToValueAtTime(p.gain, audioCtx.currentTime + 2);
    if(p.lfo){
      const lfo = audioCtx.createOscillator(), lfoG = audioCtx.createGain();
      lfo.frequency.value = p.lfo; lfoG.gain.value = p.freq * .4;
      lfo.connect(lfoG); lfoG.connect(filt.frequency); lfo.start();
      soundNodes.push(lfo);
    }
    src.connect(filt); filt.connect(gain); gain.connect(audioCtx.destination);
    src.start(); soundNodes.push(src, filt, gain);
  } catch(e) {}
}
window.addEventListener('touchend', function f(){ startAmbient(D.sonido||'selva'); window.removeEventListener('touchend',f); }, { once:true, passive:true });
window.addEventListener('click',    function f(){ if(!audioCtx) startAmbient(D.sonido||'selva'); window.removeEventListener('click',f); }, { once:true });
document.addEventListener('visibilitychange', () => {
  if(document.hidden && audioCtx) soundNodes.forEach(n => { try{ n.stop(); }catch(e){} });
});
