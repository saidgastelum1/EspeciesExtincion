<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WebAr</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Montserrat:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'museum-orange': '#FF5733',
                        'accent-orange': '#FF9500',
                        'ar-cyan': '#00D4FF',
                    },
                    fontFamily: {
                        'cinzel': ['Cinzel', 'serif'],
                        'montserrat': ['Montserrat', 'sans-serif'],
                        'mono': ['"Share Tech Mono"', 'monospace'],
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #000000;
            color: #FFFFFF;
            overflow-x: hidden;
            overflow-y: auto;
            -webkit-tap-highlight-color: transparent;
        }

        .grid-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(rgba(245, 166, 35, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(245, 166, 35, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: -1;
        }

        .outer-frame {
            position: fixed;
            top: 15px; left: 15px; right: 15px; bottom: 15px;
            border: 6px solid #D84315;
            border-radius: 2rem;
            pointer-events: none;
            z-index: 50;
        }

        @media (min-width: 768px) {
            .outer-frame {
                top: 25px; left: 25px; right: 25px; bottom: 25px;
                border-width: 10px;
                border-radius: 3.5rem;
            }
        }

        .title-neon {
            color: #FF9500;
            text-shadow: 0 0 10px rgba(255, 149, 0, 0.3);
        }

        .btn-solid {
            background-color: #FF9500;
            box-shadow: 0 0 25px rgba(0, 212, 255, 0.4);
            transition: all 0.2s ease;
        }

        .btn-solid:active { transform: scale(0.95); }

        /* Floating animation for Jaguar */
        .emoji-float {
            animation: float-simple 4s ease-in-out infinite;
        }

        @keyframes float-simple {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
        }

        main {
            min-height: 100vh;
            min-height: 100dvh;
            width: 100%;
            padding: 185px 24px 40px; 
        }

        @media (min-width: 768px) {
            main {
                padding: 220px 40px 40px;
            }
        }

        /* Capa de bloqueo para forzar modo vertical en celulares */
        #landscape-lock {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #000000;
            z-index: 9999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        /* Detecta pantallas móviles en orientación horizontal */
        @media (max-height: 600px) and (orientation: landscape) {
            #landscape-lock {
                display: flex;
            }
            body {
                overflow: hidden !important;
            }
        }
    </style>
</head>
<body class="font-montserrat relative">
    
    <!-- Pantalla de bloqueo para móviles en horizontal -->
    <div id="landscape-lock">
        <span class="text-4xl mb-4">🔄</span>
        <h2 class="font-cinzel text-xl font-bold title-neon tracking-wide">POR FAVOR GIRA TU TELÉFONO</h2>
        <p class="font-montserrat text-sm text-gray-400 mt-2">Esta experiencia está diseñada para disfrutarse en posición vertical.</p>
    </div>

    <div class="grid-overlay"></div>
    <div class="outer-frame"></div>

    <!-- SECCIÓN DE LOGOS OPTIMIZADA -->
    <div class="absolute top-9 md:top-14 left-0 w-full flex flex-col items-center gap-3 md:gap-5 z-20 px-4">
        
        <div class="w-full max-w-[82%] sm:max-w-[75%] md:max-w-2xl lg:max-w-4xl flex flex-col items-center gap-3 md:gap-5">
            
            <!-- Logo Agencia -->
            <div class="flex justify-center w-full max-w-[320px] sm:max-w-[360px] md:max-w-md lg:max-w-lg">
                <img src="img/logo-agencia-digital.png" alt="Agencia Digital" class="w-full h-auto max-h-[52px] sm:max-h-[58px] md:max-h-[72px] lg:max-h-[80px] object-contain filter brightness-110 contrast-105 drop-shadow-[0_2px_8px_rgba(0,0,0,0.85)]">
            </div>
            
            <div class="flex justify-between items-center w-full gap-2 md:gap-12">
                <img src="img/logo-much.png" alt="Logo 1" class="h-6 sm:h-7 md:h-10 lg:h-12 object-contain filter brightness-110 contrast-105 drop-shadow-[0_2px_8px_rgba(0,0,0,0.85)]">
                <img src="img/logo-planetario.png" alt="Logo 2" class="h-6 sm:h-7 md:h-10 lg:h-12 object-contain filter brightness-110 contrast-105 drop-shadow-[0_2px_8px_rgba(0,0,0,0.85)]">
                <img src="img/logo-sbeel-dinosaurios.png" alt="Logo 4" class="h-6 sm:h-7 md:h-10 lg:h-12 object-contain filter brightness-110 contrast-105 drop-shadow-[0_2px_8px_rgba(0,0,0,0.85)]">
                <img src="img/logo-sata.png" alt="Logo 5" class="h-6 sm:h-7 md:h-10 lg:h-12 object-contain filter brightness-110 contrast-105 drop-shadow-[0_2px_8px_rgba(0,0,0,0.85)]">
            </div>

        </div>

    </div>

    <!-- CONTENEDOR PRINCIPAL -->
    <main class="flex flex-col md:flex-row items-center justify-center gap-6 md:gap-16 lg:gap-24 z-10 relative max-w-7xl mx-auto overflow-hidden">
        
        <!-- Bloque Izquierdo: Textos y Acciones -->
        <div class="flex-none md:flex-1 flex flex-col items-center md:items-start text-center md:text-left gap-5 md:gap-6 animate__animated animate__fadeInLeft">
            
            <header>
                <h1 class="font-cinzel text-4xl md:text-5xl lg:text-7xl font-black title-neon leading-[0.9] md:leading-none tracking-wide">
                    ESPECIES <br class="hidden md:block"> EN RIESGO
                </h1>
            </header>
            
            <ul class="space-y-3 md:space-y-4 font-bold text-sm md:text-lg lg:text-xl tracking-tight text-gray-100">
                <li class="flex items-center justify-center md:justify-start gap-3">
                    <span class="text-base md:text-xl">🔍</span> 1. ESCANEA EL CÓDIGO QR
                </li>
                <li class="flex items-center justify-center md:justify-start gap-3">
                    <span class="text-base md:text-xl">🔓</span> 2. ACTIVA LA CÁMARA
                </li>
                <li class="flex items-center justify-center md:justify-start gap-3">
                    <span class="text-base md:text-xl">🐆</span> 3. DESCUBRE LA ESPECIE EN AR
                </li>
            </ul>

            <div class="mt-3 md:mt-4">
                <a href="catalogo.html" class="btn-solid inline-block px-10 md:px-14 py-4 md:py-5 rounded-full text-black font-black text-lg md:text-xl tracking-tight uppercase no-underline hover:scale-105 transition-transform">
                    ¡INICIAR EXPERIENCIA!
                </a>
            </div>
        </div>

        <!-- Imagen del Jaguar -->
        <div class="flex-none md:flex-1 flex justify-center items-center animate__animated animate__fadeInRight mt-2 md:mt-0">
            <div class="emoji-float select-none cursor-default">
                <img src="img/jaguar.png" alt="Jaguar Real" class="w-60 sm:w-72 md:w-96 lg:w-[34rem] object-contain drop-shadow-[0_0_55px_rgba(255,149,0,0.35)]">
            </div>
        </div>

    </main>

    <script>
        function checkOrientation() {
            const lockScreen = document.getElementById('landscape-lock');
            // Si es un dispositivo móvil basado en el ancho/alto de pantalla común
            if (window.innerWidth > window.innerHeight && window.innerHeight <= 600) {
                lockScreen.style.display = 'flex';
                document.body.style.overflow = 'hidden';
            } else {
                lockScreen.style.display = 'none';
                document.body.style.overflow = 'auto';
            }
        }

        window.addEventListener('resize', checkOrientation);
        window.addEventListener('load', checkOrientation);
    </script>

</body>
</html>
