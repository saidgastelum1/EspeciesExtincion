<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WebAr</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Montserrat:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <!-- Animate.css -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'museum-orange': '#FF5733',
                        'accent-orange': '#FF9500', /* Brighter Orange for visibility */
                        'ar-cyan': '#00D4FF',
                    },
                    fontFamily: {
                        'cinzel': ['Cinzel', 'serif'],
                        'montserrat': ['Montserrat', 'sans-serif'],
                        'mono': ['"Share Tech Mono"', 'monospace'],
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #000000;
            color: #FFFFFF;
            overflow-x: hidden;
            overflow-y: auto;
            -webkit-tap-highlight-color: transparent;
        }

        /* Ambient Technical Grid */
        .grid-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(rgba(245, 166, 35, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(245, 166, 35, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: -1;
        }

        /* Responsive Outer Frame */
        .outer-frame {
            position: fixed;
            top: 15px; left: 15px; right: 15px; bottom: 15px;
            border: 6px solid #D84315;
            border-radius: 2rem;
            pointer-events: none;
            z-index: 50;
        }

        @media (min-width: 768px) {
            .outer-frame {
                top: 25px; left: 25px; right: 25px; bottom: 25px;
                border-width: 10px;
                border-radius: 3.5rem;
            }
        }

        /* High Visibility Title Style */
        .title-neon {
            color: #FF9500;
            text-shadow: 0 0 10px rgba(255, 149, 0, 0.3);
        }

        /* Solid Orange Button */
        .btn-solid {
            background-color: #FF9500;
            box-shadow: 0 0 25px rgba(0, 212, 255, 0.4);
            transition: all 0.2s ease;
        }

        .btn-solid:active { transform: scale(0.95); }

        /* Floating animation for Jaguar */
        .emoji-float {
            animation: float-simple 4s ease-in-out infinite;
        }

        @keyframes float-simple {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
        }

        /* Viewport safety padding */
        main {
            min-height: 100vh;
            width: 100%;
            padding: 100px 30px 40px; /* Increased top padding for logos */
        }

        /* Mobile Landscape Optimization */
        @media (max-height: 600px) and (orientation: landscape) {
            main { 
                padding-top: 60px !important; 
                padding-bottom: 20px !important;
                gap: 1.5rem !important;
            }
            .outer-frame {
                top: 10px !important; left: 10px !important; right: 10px !important; bottom: 10px !important;
                border-width: 4px !important; border-radius: 1.5rem !important;
            }
            .absolute.z-20 { top: 15px !important; }
            .absolute.z-20 img { height: 25px !important; }
            h1 { font-size: 2.2rem !important; line-height: 1 !important; }
            ul li { font-size: 0.9rem !important; }
            .btn-solid { padding: 10px 20px !important; font-size: 0.9rem !important; }
            .emoji-float img { width: 180px !important; }
        }
    </style>
</head>
<body class="font-montserrat relative">
    
    <div class="grid-overlay"></div>
    <div class="outer-frame"></div>

    <!-- Agency Logos Header -->
    <div class="absolute top-8 md:top-12 left-0 w-full flex justify-center items-center gap-6 md:gap-12 z-20 px-8">
        <img src="img/logo-much.png" alt="Logo 1" class="h-7 md:h-10 object-contain">
        <img src="img/logo-planetario.png" alt="Logo 2" class="h-7 md:h-10 object-contain">
        <img src="img/logo-agencia-digital.png" alt="Logo 3" class="h-7 md:h-10 object-contain">
        <img src="img/logo-sbeel-dinosaurios.png" alt="Logo 4" class="h-7 md:h-10 object-contain">
    </div>

    <!-- Main Content: Mobile Centered & Compact, Desktop Split -->
    <main class="flex flex-col md:flex-row items-center justify-center gap-4 md:gap-16 lg:gap-24 z-10 relative max-w-7xl mx-auto overflow-hidden">
        
        <!-- Top/Left Block: Text & Action -->
        <div class="flex-none md:flex-1 flex flex-col items-center md:items-start text-center md:text-left gap-4 md:gap-6 animate__animated animate__fadeInLeft">
            
            <header>
                <h1 class="font-cinzel text-4xl md:text-5xl lg:text-7xl font-black title-neon leading-[0.85] md:leading-none">
                    ESPECIES <br class="hidden md:block"> EXTINCIÓN
                </h1>
            </header>
            
            <ul class="space-y-2 md:space-y-4 font-bold text-sm md:text-lg lg:text-xl tracking-tight">
                <li class="flex items-center justify-center md:justify-start gap-3">
                    <span>🔍</span> 1. ESCANEA EL CÓDIGO QR
                </li>
                <li class="flex items-center justify-center md:justify-start gap-3">
                    <span>🔓</span> 2. ACTIVA LA CÁMARA
                </li>
                <li class="flex items-center justify-center md:justify-start gap-3">
                    <span>🐆</span> 3. DESCUBRE LA ESPECIE EN AR
                </li>
            </ul>

            <div class="mt-2 md:mt-4">
                <a href="catalogo.html" class="btn-solid inline-block px-10 md:px-14 py-4 md:py-5 rounded-full text-black font-black text-lg md:text-xl tracking-tight uppercase no-underline hover:scale-105 transition-transform">
                    ¡INICIAR EXPERIENCIA!
                </a>
            </div>
        </div>

        <!-- Bottom/Right Block: Jaguar Real Image -->
        <div class="flex-none md:flex-1 flex justify-center items-center animate__animated animate__fadeInRight mt-4 md:mt-0">
            <div class="emoji-float select-none cursor-default">
                <img src="img/jaguar.png" alt="Jaguar Real" class="w-64 md:w-96 lg:w-[32rem] object-contain drop-shadow-[0_0_50px_rgba(255,149,0,0.3)]">
            </div>
        </div>

    </main>

</body>
</html>
