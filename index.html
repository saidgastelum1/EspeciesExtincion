<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WebAr</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Montserrat:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <!-- Animate.css -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'museum-orange': '#FF5733',
                        'accent-orange': '#F5A623',
                        'ar-cyan': '#00D4FF',
                    },
                    fontFamily: {
                        'cinzel': ['Cinzel', 'serif'],
                        'montserrat': ['Montserrat', 'sans-serif'],
                        'mono': ['"Share Tech Mono"', 'monospace'],
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #000000;
            color: #FFFFFF;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        /* Ambient Technical Grid */
        .grid-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(rgba(245, 166, 35, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(245, 166, 35, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: -1;
        }

        /* Outer Frame adjusted */
        .outer-frame {
            position: fixed;
            top: 20px; left: 20px; right: 20px; bottom: 20px;
            border: 10px solid #D84315;
            border-radius: 3rem;
            pointer-events: none;
            z-index: 50;
        }

        .text-gradient {
            background: linear-gradient(to bottom, #FFFFFF 0%, #F5A623 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Solid Orange Button - No Gradient */
        .btn-solid {
            background-color: #F5A623;
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.5);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-solid:active { transform: scale(0.96); }

        /* No aura/glow for the jaguar as requested */
        .emoji-central {
            animation: float-center 4s ease-in-out infinite;
        }

        @keyframes float-center {
            0%, 100% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-20px) scale(1.05); }
        }

        /* Main Container for the split layout */
        main {
            height: 100vh;
            padding: 60px;
        }
    </style>
</head>
<body class="font-montserrat relative">
    
    <div class="grid-overlay"></div>
    <div class="outer-frame"></div>

    <!-- Main Content: Letters Left, Jaguar Right -->
    <main class="flex flex-col md:flex-row items-center justify-center gap-10 lg:gap-20 z-10 relative w-full h-screen max-w-6xl mx-auto">
        
        <!-- Left Side: Letters & Button -->
        <div class="flex-1 flex flex-col items-center md:items-start text-center md:text-left gap-6 animate__animated animate__fadeInLeft">
            
            <!-- Title -->
            <header>
                <h1 class="font-cinzel text-4xl md:text-5xl lg:text-7xl font-black text-gradient leading-none">
                    ESPECIES <br class="hidden md:block"> EXTINCIÓN
                </h1>
            </header>
            
            <!-- Steps -->
            <ul class="space-y-3 font-bold text-base md:text-xl tracking-tight">
                <li class="flex items-center gap-3">
                    <span>🔍</span> 1. ESCANEA EL CÓDIGO QR
                </li>
                <li class="flex items-center gap-3">
                    <span>🔓</span> 2. ACTIVA LA CÁMARA
                </li>
                <li class="flex items-center gap-3">
                    <span>🐆</span> 3. DESCUBRE LA ESPECIE EN AR
                </li>
            </ul>

            <!-- Solid Button -->
            <div class="mt-4">
                <a href="catalogo.html" class="btn-solid inline-block px-12 py-5 rounded-full text-black font-black text-xl tracking-tight uppercase no-underline transition-all hover:scale-105">
                    ¡INICIAR EXPERIENCIA!
                </a>
            </div>
        </div>

        <!-- Right Side: Massive Jaguar Face (No Glow) -->
        <div class="flex-1 flex justify-center items-center animate__animated animate__fadeInRight">
            <div class="text-[12rem] md:text-[18rem] lg:text-[22rem] emoji-central select-none cursor-default">
                🐯
            </div>
        </div>

    </main>

</body>
</html>
