<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="theme-color" content="#000"/>
<title>Especies en Peligro</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Raleway:ital,wght@0,300;0,400;0,600;1,300&family=Share+Tech+Mono&display=swap" rel="stylesheet">

<!-- Mismo archivo de datos que usa especie.html -->
<script src="especies.js"></script>

<style>
:root{
  --A:#F5A623;
  --bg:#0a0a0a;
  --surface:rgba(255,255,255,.05);
  --border:rgba(255,255,255,.10);
  --text:rgba(255,255,255,.88);
  --muted:rgba(255,255,255,.38);
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{
  width:100%;height:100%;
  background:var(--bg);
  font-family:'Raleway',sans-serif;
  color:var(--text);
  overflow-x:hidden;
}

/* ── Cámara de fondo (igual que jaguar.html) ── */
#cam-bg{
  position:fixed;top:0;left:0;
  width:100vw;height:100vh;
  object-fit:cover;z-index:0;
  background:#111;
  opacity:.35;   /* más tenue que en especie.html para leer el catálogo */
}
#cam-bg::after{
  content:'';position:fixed;inset:0;
  background:linear-gradient(to bottom,rgba(0,0,0,.7),rgba(0,0,0,.5));
}

/* ── Scroll principal ── */
#page{
  position:fixed;inset:0;z-index:10;
  overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
  padding-bottom:40px;
}
#page::-webkit-scrollbar{display:none}

/* ── HEADER ── */
.header{
  position:sticky;top:0;z-index:50;
  padding:env(safe-area-inset-top,14px) 16px 0;
  background:linear-gradient(to bottom,rgba(0,0,0,.85) 60%,transparent);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
}
.header-top{
  display:flex;align-items:center;gap:12px;
  padding-bottom:12px;
}
.btn-back{
  width:40px;height:40px;flex-shrink:0;
  border-radius:50%;
  background:rgba(255,255,255,.08);
  border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  text-decoration:none;color:#fff;
  font-family:'Share Tech Mono',monospace;
  font-size:.9rem;
  transition:background .2s;
}
.btn-back:active{background:rgba(255,255,255,.18)}

/* Buscador */
.search-wrap{
  flex:1;
  position:relative;
}
.search-ico{
  position:absolute;left:12px;top:50%;
  transform:translateY(-50%);
  font-size:.9rem;opacity:.45;
  pointer-events:none;
}
.search-input{
  width:100%;
  background:rgba(255,255,255,.09);
  border:1px solid var(--border);
  border-radius:12px;
  padding:11px 14px 11px 36px;
  color:#fff;
  font-family:'Raleway',sans-serif;
  font-size:.9rem;font-weight:400;
  outline:none;
  transition:border-color .2s,background .2s;
  -webkit-appearance:none;
}
.search-input::placeholder{color:rgba(255,255,255,.3)}
.search-input:focus{
  border-color:rgba(245,166,35,.5);
  background:rgba(255,255,255,.12);
}

/* Filtros */
.filters{
  display:flex;gap:6px;
  padding:0 0 12px;
  overflow-x:auto;scrollbar-width:none;
}
.filters::-webkit-scrollbar{display:none}
.filter-btn{
  flex-shrink:0;
  padding:6px 14px;
  border-radius:999px;
  border:1px solid var(--border);
  background:rgba(255,255,255,.06);
  color:var(--muted);
  font-family:'Share Tech Mono',monospace;
  font-size:.52rem;letter-spacing:.1em;text-transform:uppercase;
  cursor:pointer;
  transition:all .2s;
  -webkit-tap-highlight-color:transparent;
}
.filter-btn.active{
  background:rgba(245,166,35,.18);
  border-color:rgba(245,166,35,.55);
  color:var(--A);
}
.filter-btn.critico.active{background:rgba(255,23,68,.16);border-color:rgba(255,23,68,.5);color:#FF1744}
.filter-btn.vulnerable.active{background:rgba(255,145,0,.16);border-color:rgba(255,145,0,.5);color:#FF9100}
.filter-btn.amenazado.active{background:rgba(0,229,255,.14);border-color:rgba(0,229,255,.45);color:#00E5FF}

/* Contador */
.results-count{
  padding:6px 16px 10px;
  font-family:'Share Tech Mono',monospace;
  font-size:.52rem;letter-spacing:.12em;text-transform:uppercase;
  color:var(--muted);
}
.results-count span{color:var(--A)}

/* ── GRID ── */
.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  padding:0 12px;
}
@media(min-width:480px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}}

/* Card */
.card{
  background:rgba(0,0,0,.3);
  border:1px solid var(--border);
  border-radius:16px;
  overflow:hidden;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
  transition:transform .2s,border-color .2s;
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  position:relative;
}
.card:active{transform:scale(.97)}

/* línea de color superior según estado */
.card::before{
  content:'';
  position:absolute;top:0;left:0;right:0;height:2px;
  background:var(--card-color, rgba(255,255,255,.15));
  opacity:.8;
}

.card-top{
  height:100px;
  display:flex;align-items:center;justify-content:center;
  position:relative;
  font-size:3.2rem;
  background:rgba(255,255,255,.03);
}
/* pill de estado en la card */
.card-status{
  position:absolute;top:8px;right:8px;
  width:8px;height:8px;border-radius:50%;
  animation:blink 1.8s ease-in-out infinite;
}
.card-num{
  position:absolute;top:8px;left:10px;
  font-family:'Share Tech Mono',monospace;
  font-size:.48rem;color:rgba(255,255,255,.25);
  letter-spacing:.08em;
}

.card-body{padding:10px 12px 14px}
.card-nombre{
  font-family:'Cinzel',serif;
  font-size:.82rem;font-weight:700;
  line-height:1.2;margin-bottom:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.card-cient{
  font-style:italic;font-weight:300;
  font-size:.65rem;color:var(--muted);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  margin-bottom:6px;
}
.card-cat{
  font-family:'Share Tech Mono',monospace;
  font-size:.48rem;letter-spacing:.1em;text-transform:uppercase;
  color:rgba(255,255,255,.2);
}

/* Estado colores */
.s-critico  { --card-color:#FF1744; background:#FF1744; }
.s-vulnerable{ --card-color:#FF9100; background:#FF9100; }
.s-amenazado { --card-color:#00E5FF; background:#00E5FF; }

/* Vacío */
.empty{
  grid-column:1/-1;
  text-align:center;
  padding:60px 24px;
  color:var(--muted);
}
.empty-ico{font-size:3rem;margin-bottom:12px;opacity:.4}
.empty-txt{font-size:.9rem;line-height:1.6}

/* Velo transición */
#veil{
  position:fixed;inset:0;z-index:9999;
  background:#000;opacity:0;
  pointer-events:none;
  transition:opacity .35s ease;
}
#veil.show{opacity:1;pointer-events:all}

@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes card-in{
  from{opacity:0;transform:translateY(12px)}
  to{opacity:1;transform:translateY(0)}
}
</style>
</head>
<body>

<!-- Cámara de fondo -->
<video id="cam-bg" autoplay playsinline muted></video>

<div id="page">

  <!-- Header con buscador -->
  <div class="header">
    <div class="header-top">
      <a class="btn-back" href="index.html">←</a>
      <div class="search-wrap">
        <span class="search-ico">🔍</span>
        <input
          class="search-input"
          id="search"
          type="search"
          placeholder="Buscar especie…"
          autocomplete="off"
          autocorrect="off"
          spellcheck="false"
        />
      </div>
    </div>

    <!-- Filtros por estado -->
    <div class="filters">
      <button class="filter-btn active" data-filter="all">Todas</button>
      <button class="filter-btn critico"   data-filter="EN PELIGRO CRÍTICO">● Crítico</button>
      <button class="filter-btn vulnerable" data-filter="VULNERABLE">● Vulnerable</button>
      <button class="filter-btn amenazado" data-filter="AMENAZADO">● Amenazado</button>
    </div>
  </div>

  <!-- Contador -->
  <div class="results-count">
    <span id="count">0</span> especies encontradas
  </div>

  <!-- Grid -->
  <div class="grid" id="grid"></div>

</div>

<div id="veil"></div>

<script>
/* ── Render del grid ── */
const COLS = {
  "EN PELIGRO CRÍTICO": { color:"#FF1744", cls:"s-critico"   },
  "VULNERABLE":         { color:"#FF9100", cls:"s-vulnerable" },
  "AMENAZADO":          { color:"#00E5FF", cls:"s-amenazado"  },
};

let currentFilter = "all";
let currentSearch = "";

function render(){
  const grid = document.getElementById('grid');
  const list = ESPECIES.filter(e => {
    const matchFilter = currentFilter === "all" || e.estado === currentFilter;
    const q = currentSearch.toLowerCase();
    const matchSearch = !q ||
      e.nombre.toLowerCase().includes(q) ||
      e.cient.toLowerCase().includes(q)  ||
      e.categoria.toLowerCase().includes(q) ||
      e.habitat.toLowerCase().includes(q);
    return matchFilter && matchSearch;
  });

  document.getElementById('count').textContent = list.length;

  if(!list.length){
    grid.innerHTML = `
      <div class="empty">
        <div class="empty-ico">🔍</div>
        <p class="empty-txt">No encontramos ninguna especie<br/>que coincida con "<strong>${currentSearch}</strong>"</p>
      </div>`;
    return;
  }

  grid.innerHTML = list.map((e, i) => {
    const co = COLS[e.estado] || COLS["VULNERABLE"];
    return `
      <div class="card" onclick="navegar('especie.html?id=${e.id}')"
           style="--card-color:${co.color};animation:card-in .3s ease ${i*0.04}s both">
        <div class="card-top">
          <span class="card-num">${String(i+1).padStart(2,'0')}</span>
          <span>${e.emoji}</span>
          <span class="card-status ${co.cls}"></span>
        </div>
        <div class="card-body">
          <div class="card-nombre">${e.nombre}</div>
          <div class="card-cient">${e.cient}</div>
          <div class="card-cat">${e.categoria}</div>
        </div>
      </div>`;
  }).join('');
}

/* ── Búsqueda ── */
document.getElementById('search').addEventListener('input', e => {
  currentSearch = e.target.value.trim();
  render();
});

/* ── Filtros ── */
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    render();
  });
});

/* ── Cámara de fondo ── */
(async function(){
  try{
    const s = await navigator.mediaDevices.getUserMedia({
      video:{ facingMode:{ ideal:'environment' } }, audio:false
    });
    document.getElementById('cam-bg').srcObject = s;
  } catch(e){ /* sin cámara: fondo negro */ }
})();

/* ── Transición ── */
function navegar(url){
  const v = document.getElementById('veil');
  v.classList.add('show');
  setTimeout(()=> window.location.href = url, 360);
}

window.addEventListener('DOMContentLoaded', () => {
  // fade-in al entrar
  const v = document.getElementById('veil');
  v.style.opacity='1'; v.style.transition='none';
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    v.style.transition='opacity .4s ease';
    v.style.opacity='0';
  }));
  render();
});
</script>

</body>
</html>
